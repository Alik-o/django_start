{% extends 'base.html' %}
{% block title %}Удаление{% endblock %}
{% block content %}
<div class="container mt-2">
    <h1 class="mb-4">Удаление товара</h1>
    <form method="post" enctype="multipart/form-data">
        <p>Вы уверены, что хотите удалить продукт "{{object.name}}"?</p>
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'catalog:product_info' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
