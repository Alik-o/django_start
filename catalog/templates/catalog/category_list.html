{% extends 'catalog/base.html' %}
{% block title %}Категории{% endblock %}
{% block content %}
{% for category in object_list %}
<div class="col-md-4">
    <div class="d-flex p-3 h-100 justify-content-center">
    <div class="card mb-4 box-shadow">
        <div class="card-header">
            <h2 class="my-0 font-weight-normal">{{ category.name }}</h2>
        </div>
        <div class="d-flex align-items-end h-100">
        <div class="card-body align-items-end">
            <a class="btn btn-primary" href="{% url 'catalog:products' category.pk %}" role="button">Посмотреть</a>
        </div>
        </div>
    </div>
    </div>
</div>
{% endfor %}
<div class="col-md-4">
    <div class="d-flex p-3 h-100 justify-content-center">
    <div class="card mb-4 box-shadow card text-bg-info">
        <div class="card-header">
            <h2 class="my-0 font-weight-normal">Создать новую категорию</h2>
        </div>
        <div class="d-flex align-items-end h-100">
        <div class="card-body align-items-end">
            <a class="btn btn-primary" href="{% url 'catalog:category_form' %}" role="button">Добавить</a>
        </div>
        </div>
    </div>
    </div>
</div>
{% endblock %}
