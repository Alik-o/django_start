{% extends 'base.html' %}
{% load my_tags %}
{% block title %}Продукты{% endblock %}
{% block content %}
{% for product in products %}
<div class="row g-2 bg-body-secondary position-relative text-bg-secondary p-0 w-100">
    <div class="col-md-4 mb-md-0 p-md-4">
        <img src="{{ product.image | media_filter }}" class="w-100" style="width: 100px; height: 200px;" alt="Изображение продукта">
    </div>
    <div class="col-md-8 p-4 ps-md-0">
        <h5 class="mt-0">{{ product.name }}</h5>
        <p>{{ product.description|truncatechars:100 }}</p>
        <h3 class="card-title pricing-card-title mb-3">$ {{ product.price }}</h3>
        <a href="{% url 'catalog:product_info' product.pk %}" class="btn btn-primary">Подробнее</a>
        <a href="#" class="btn btn-primary">Купить</a>
    </div>
</div>
{% endfor %}
{% endblock %}
