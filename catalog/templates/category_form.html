{% extends 'base.html' %}
{% block title %}Создание новой категории товара{% endblock %}
{% block content %}
<div class="container mt-2">
    <h1 class="mb-4">Создание новой категории товара</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">
            Сохранить
        </button>
        <a href="/" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
