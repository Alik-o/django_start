{% extends 'base.html' %}
{% block title %}Категории{% endblock %}
{% block content %}
{% for category in object_list %}
<div class="col-4">
    <div class="card mb-4 box-shadow">
        <div class="card-header">
            <h2 class="my-0 font-weight-normal">{{ category.name }}</h2>
        </div>
        <div class="card-body">
            <a class="btn btn-primary" href="{% url 'catalog:products' category.pk %}" role="button">Посмотреть</a>
        </div>
    </div>
</div>
{% endfor %}
{% endblock %}
