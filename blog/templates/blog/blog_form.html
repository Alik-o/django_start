{% extends 'blog/base_blog.html' %}
{% block title %}Создание{% endblock %}
{% block content %}
<div class="container mt-2">
    <h1 class="mb-4">Создание новой публикации</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">
            {% if object %}
            Сохранить
            {% else %}
            Создать
            {% endif %}
        </button>
        <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
