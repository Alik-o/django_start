{% extends 'blog/base_blog.html' %}
{% block title %}Список публикаций{% endblock %}
{% block content %}
<h3 class="pb-4 mb-4 pt-4 fst-italic border-bottom">Список публикаций</h3>
{% for blog in object_list %}
<div class="container border-bottom pb-3">
    <div class="position-sticky" style="top: 2rem;">
        <div class="p-2 mb-3 bg-body-tertiary rounded">
            <h4 class="fst-italic">{{ blog.title }}</h4>
            <p class="p-2">{{ blog.content|truncatewords:10 }}</p>
        </div>
        <div class="d-flex justify-content-start align-items-center">
            <p> Просмотров {{ blog.count_views }} </p>
        </div>
        <div class="d-flex justify-content-end align-items-center">
            <a class="btn btn-sm btn-outline-secondary" href="{% url 'blog:blog_detail' blog.pk %}">Читать</a>
        </div>
    </div>
</div>
{% endfor %}
{% endblock %}
